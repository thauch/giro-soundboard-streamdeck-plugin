name: Build and release Stream Deck plugin

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24.14.0'
          cache: npm
      - name: Verify release tag
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node -e 'const p=JSON.parse(require("node:fs").readFileSync("package.json")); if(process.env.RELEASE_TAG!=="v"+p.version) throw Error("Tag must match package.json version");'
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run package
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/Giro-Soundboard-*.streamDeckPlugin dist/Giro-StreamDeck-XL-*.zip dist/SHA256SUMS.txt --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$RELEASE_TAG" dist/Giro-Soundboard-*.streamDeckPlugin dist/Giro-StreamDeck-XL-*.zip dist/SHA256SUMS.txt --verify-tag --generate-notes --title "Giro Soundboard Stream Deck $RELEASE_TAG" --repo "$GITHUB_REPOSITORY"
          fi
